name: MaterialFiles with Sora-Editor

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload to (e.g. v1.7.9, optional)'
        required: false
        type: string
  push:
    branches: [Sora-Editor_1.7, main]
    tags: ['*']

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    # Expose signing credentials to every step (incl. Gradle build).
    env:
      STORE_FILE: key.jks
      STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        show-progress: false

    - name: Get version and short SHA
      id: get_tag
      run: |
        # The version comes from version.properties, the single source of truth shared
        # with app/build.gradle (versionName/versionCode) 鈥?bump one file, everything
        # follows.
        major=$(grep -Po '^versionMajor=\K[0-9]+' version.properties)
        minor=$(grep -Po '^versionMinor=\K[0-9]+' version.properties)
        patch=$(grep -Po '^versionPatch=\K[0-9]+' version.properties)
        if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
          tag='1.7.9'
        else
          tag="$major.$minor.$patch"
        fi
        echo "tag=$tag" >> $GITHUB_OUTPUT
        echo "Short_SHA=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_OUTPUT

    - name: Determine release tag
      id: release_tag
      run: |
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          # Pushed for an explicit tag (e.g. v1.7.9): upload to that tag.
          echo "release=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
        elif [ -n "${{ inputs.release_tag }}" ]; then
          # Manual run with a chosen tag: upload to it.
          echo "release=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
        else
          # Branch push: keep the previous auto-versioned build tag.
          echo "release=${{ steps.get_tag.outputs.tag }}-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
        fi

    - name: Delete Non-Free Code
      run: |
        rm -rf app/src/main/java/me/zhanghai/android/files/nonfree
        find app/src -type f -exec sed -i '/\/\/#ifdef NONFREE/,/\/\/#endif/d' {} +

    - name: Write Signing Configuration
      run: |
        if [ -n "${{ secrets.KEY_STORE }}" ]; then
          printf '%s' "${{ secrets.KEY_STORE }}" | tr -d '[:space:]' | base64 --decode > key.jks
          if [ ! -s key.jks ]; then echo "::error::Failed to decode KEY_STORE secret"; exit 1; fi
          echo "Signing keystore written; credentials passed via environment"
        else
          echo "No signing secrets configured, falling back to debug signing"
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' app/build.gradle
        fi

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build with Gradle
      run: ./gradlew assembleRelease --parallel --stacktrace

    - name: Rename artifact
      id: rename
      working-directory: app/build/outputs/apk/release/
      run: |
        APK=$(ls app-release*.apk)
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          NAME="MaterialFiles.Sora-Editor-$GITHUB_REF_NAME.apk"
        elif [ -n "${{ inputs.release_tag }}" ]; then
          NAME="MaterialFiles.Sora-Editor-${{ inputs.release_tag }}.apk"
        else
          NAME="MaterialFiles.Sora-Editor-${{ steps.get_tag.outputs.tag }}@${{ steps.get_tag.outputs.Short_SHA }}.apk"
        fi
        mv "$APK" "$NAME"
        echo "apk_name=$NAME" >> $GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaterialFiles-release ${{ steps.get_tag.outputs.tag }}@${{ steps.get_tag.outputs.Short_SHA }}
        path: app/build/outputs/apk/release/*.apk
        retention-days: 28

    - name: Upload to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RELEASE_TAG="${{ steps.release_tag.outputs.release }}"
        APK="app/build/outputs/apk/release/${{ steps.rename.outputs.apk_name }}"
        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          # Release (or its tag) already exists: attach the APK to it.
          gh release upload "$RELEASE_TAG" "$APK" --clobber
        else
          gh release create \
            "$RELEASE_TAG" \
            "$APK" \
            --title "MaterialFiles Sora-Editor $RELEASE_TAG" \
            --notes "Automated build of commit ${{ github.sha }}"
        fi

